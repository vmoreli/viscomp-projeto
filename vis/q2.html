534": "Desenho Geométrico e Geometria Descritiva", "SLC0606": "Introdução aos Estudos da Educação: ciência, sociologia e imprensa", "SLC0610": "Computação e Tecnologias Aplicadas na Educação", "SLC0615": "Estrutura e Funcionamento do Ensino Fundamental e Médio", "SLC0621": "Biologia 2", "SLC0631": "Psicologia da Educação 2", "SLC0680": "Língua Brasileira de Sinais para a Licenciatura", "7600022": "Mecânica Quântica A", "7600117": "Física Aplicada para Químicos", "7500004": "Matemática Aplicada à Química", "SAA0180": "Sistemas Dinâmicos", "SEL0337": "Projetos em Sistemas Embarcados", "SEL0314": "Circuitos Eletrônicos II", "SEL0346": "Comunicação Digital I", "SEL0383": "Sinais e Sistemas em Engenharia Elétrica", "SEL0415": "Introdução à Organização de Computadores", "SEL0450": "Semicondutores", "SEL0452": "Medidas e Circuitos Elétricos", "SEM0343": "Processos de Usinagem", "SEM0388": "Princípios de Metrologia Industrial", "SEM0565": "Desenho Técnico Mecânico II", "SEM0566": "Sistemas e Métodos de Controle de Processos", "SEM0567": "Processos de Fabricação", "SEP0284": "Projeto e Manufatura", "SEL0309": "Eletromagnetismo", "SEL0454": "Introdução aos Sistemas Digitais", "SEP0285": "Práticas em Processos de Manufatura", "SMM0194": "Engenharia e Ciência dos Materiais II"}}};
const root = document.getElementById("q2_dd986dbc");

const COR = {tinta: "#0b0b0b", tinta2: "#52514e", muda: "#898781", grade: "#e1e0d9",
             cinza: "#c3c2b7", azul: "#2a78d6", fundo: "#fcfcfb", vazio: "#f1f0ea"};
// Escala sequencial de um só matiz (azul claro → azul escuro): a ordem é lida
// pela luminosidade, o que funciona para os três tipos comuns de daltonismo.
const ESCALA = [[0, COR.vazio], [0.0001, "#dce8f7"], [0.35, "#8db6ea"],
                [0.7, "#2a78d6"], [1, "#0b2f63"]];
const st = {curso: "geral", nivel: "todos", tipo: "ob", medida: "alunos", refazer: "", cel: null};
const $ = (s) => root.querySelector(s);
const fig = $(".fig");
const cfg = {displayModeBar: false, responsive: true};
const fonte = {family: "Inter, Arial, sans-serif", size: 12, color: COR.tinta2};
const ROT_TIPO = {ob: "obrigatória", el: "optativa eletiva", li: "optativa livre"};
const H = D.horas, DIAS = D.dias;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

const curso = () => st.curso === "geral" ? null : D.cursos[st.curso];
const nomeDe = (s) => curso() ? curso().discs[s].nome : D.geral.nomes[s];

// ---------- controles (consultas dinâmicas) ----------
const selCurso = $(".curso"), selNivel = $(".nivel"), selRef = $(".refazer");
[["geral", "Todas as turmas da base (visão geral)"], ...D.ordem.map((k) => [k, D.cursos[k].nome])]
  .forEach(([v, t]) => selCurso.add(new Option(t, v)));
selCurso.addEventListener("change", () => {
  st.curso = selCurso.value; st.nivel = "todos"; st.refazer = ""; st.cel = null; tudo();
});
selNivel.addEventListener("change", () => { st.nivel = selNivel.value; st.refazer = ""; st.cel = null; tudo(); });
selRef.addEventListener("change", () => { st.refazer = selRef.value; st.cel = null; tudo(); });
root.querySelectorAll(".grp").forEach((g) => g.querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => {
    if (b.disabled) return;
    st[g.dataset.k] = b.dataset.v;
    if (g.dataset.k === "tipo") st.refazer = "";
    tudo();
  })));

function obrigatoriasDoNivel(c, n) {
  return Object.entries(c.discs).filter(([s, d]) => d.tipo === "ob" && d.nivel === n);
}

function montaControles() {
  const c = curso();
  root.querySelectorAll(".grp").forEach((g) => g.querySelectorAll("button").forEach((b) => {
    b.classList.toggle("on", st[g.dataset.k] === b.dataset.v);
    b.disabled = g.dataset.k === "tipo" && !c;
  }));
  // nível: cada opção diz quantas obrigatórias daquele semestre têm turma em 2026/2
  selNivel.innerHTML = "";
  selNivel.add(new Option("Todos os semestres", "todos"));
  selNivel.disabled = !c;
  if (c) {
    const niveis = [...new Set(Object.values(c.discs).map((d) => d.nivel))].sort((a, b) => a - b);
    niveis.forEach((n) => {
      const ob = obrigatoriasDoNivel(c, n);
      const com = ob.filter(([s, d]) => d.turmas.length).length;
      selNivel.add(new Option(`${n}º semestre` + (ob.length ? ` · ${com} de ${ob.length} obrigatórias com turma` : ""), String(n)));
    });
  }
  selNivel.value = st.nivel;
  // simular reprovação: obrigatórias de dois semestres antes, que o aluno refaz agora
  const n = Number(st.nivel);
  const pode = c && n >= 3 && st.tipo !== "el";
  $(".ref").style.display = pode ? "" : "none";
  selRef.innerHTML = "";
  if (pode) {
    selRef.add(new Option("nenhuma", ""));
    const atuais = new Set(obrigatoriasDoNivel(c, n).map(([s]) => s));
    obrigatoriasDoNivel(c, n - 2).filter(([s, d]) => d.turmas.length).forEach(([s, d]) => {
      const k = c.refazer.filter(([a, b]) => a === s && atuais.has(b)).length;
      selRef.add(new Option(`${s} · ${d.nome.slice(0, 34)}` + (k ? `  (choca com ${k})` : ""), s));
    });
    $(".ref small").textContent = `obrigatória do ${n - 2}º semestre, refeita um ano depois`;
  }
  selRef.value = st.refazer;
}

// ---------- dados da visão atual ----------
function encontros() {
  const c = curso();
  if (!c) return D.geral.aulas.map((a) => ({...a, v: a.mt}));
  const ok = (d) => (st.tipo === "todas" || (st.tipo === "ob" ? d.tipo === "ob" : d.tipo !== "ob"))
    && (st.nivel === "todos" || d.nivel === Number(st.nivel));
  const lista = c.aulas.filter((a) => ok(c.discs[a.s])).map((a) => ({...a, v: a.mc}));
  if (st.refazer) c.aulas.filter((a) => a.s === st.refazer).forEach((a) => lista.push({...a, v: a.mc, rf: true}));
  return lista;
}

function paresDeChoque(siglas) {
  const c = curso();
  if (!c) return [];
  const p = c.choques.filter(([a, b]) => siglas.has(a) && siglas.has(b));
  if (st.refazer) c.refazer.forEach(([a, b]) => { if (a === st.refazer && siglas.has(b)) p.push([a, b]); });
  return p;
}

function grade() {
  const E = encontros();
  const cel = H.map(() => DIAS.map(() => ({aulas: [], siglas: new Set(), alunos: 0})));
  E.forEach((a) => a.f.forEach((h) => {
    const x = cel[H.indexOf(h)][a.d];
    x.aulas.push(a); x.siglas.add(a.s); x.alunos += a.v;
  }));
  const val = (x) => st.medida === "alunos" ? x.alunos : x.siglas.size;
  const pares = paresDeChoque(new Set(E.map((a) => a.s)));
  return {E, cel, val, pares};
}

// ---------- visão: mapa de calor dia × hora, com totais nas margens ----------
function desenha() {
  const {E, cel, val, pares} = grade();
  const z = cel.map((l) => l.map(val));
  const max = Math.max(1, ...z.flat());
  const alunos = st.medida === "alunos";
  const unidade = alunos ? (curso() ? "alunos do curso" : "alunos") : "disciplinas";
  const dica = cel.map((l, i) => l.map((x, j) => {
    if (!x.aulas.length) return `<b>${DIAS[j]} ${H[i]}h</b><br>sem aula`;
    const ss = [...x.siglas].sort();
    const linhas = ss.slice(0, 10).map((s) => {
      const as = x.aulas.filter((a) => a.s === s);
      const rf = as.some((a) => a.rf) ? "↺ " : "";
      return `${rf}${s} · ${esc(nomeDe(s).slice(0, 32))} (turma ${[...new Set(as.map((a) => a.t))].join(", ")})`;
    });
    if (ss.length > 10) linhas.push(`… e mais ${ss.length - 10}`);
    return `<b>${DIAS[j]} ${H[i]}h</b> · ${val(x)} ${unidade}<br>` + linhas.join("<br>");
  }));
  // choques: contorno escuro grosso nas células em que os dois lados de um par se encontram
  const marcadas = [];
  cel.forEach((l, i) => l.forEach((x, j) => {
    if (pares.some(([a, b]) => x.siglas.has(a) && x.siglas.has(b))) marcadas.push([i, j]);
  }));
  const formas = marcadas.map(([i, j]) => ({type: "rect", xref: "x", yref: "y", x0: j - 0.46, x1: j + 0.46,
    y0: i - 0.44, y1: i + 0.44, line: {color: COR.tinta, width: 3}}));
  if (st.cel) {
    const [i, j] = st.cel;
    formas.push({type: "rect", xref: "x", yref: "y", x0: j - 0.5, x1: j + 0.5, y0: i - 0.5, y1: i + 0.5,
      line: {color: COR.azul, width: 2, dash: "dot"}});
  }
  const notas = [];
  z.forEach((l, i) => l.forEach((v, j) => {
    if (!v) return;
    const choque = marcadas.some(([a, b]) => a === i && b === j);
    notas.push({x: j, y: i, xref: "x", yref: "y", showarrow: false,
      text: (choque ? "! " : "") + v, font: {size: 11, color: v / max > 0.55 ? "white" : COR.tinta}});
  }));
  const porDia = DIAS.map((_, j) => z.reduce((s, l) => s + l[j], 0));
  const porHora = z.map((l) => l.reduce((s, v) => s + v, 0));
  const traces = [
    {type: "heatmap", z, x: DIAS.map((_, j) => j), y: H.map((_, i) => i), customdata: dica,
     hovertemplate: "%{customdata}<extra></extra>", colorscale: ESCALA, zmin: 0, zmax: max,
     xgap: 2, ygap: 2, showscale: true,
     colorbar: {title: {text: unidade, side: "right", font: {size: 11}}, thickness: 10, len: 0.5,
                y: 0.4, x: 1.02, outlinewidth: 0, tickfont: {size: 10}, tickformat: "d",
                ...(max <= 8 ? {dtick: 1} : {})}},
    {type: "bar", x: DIAS.map((_, j) => j), y: porDia, xaxis: "x", yaxis: "y2", marker: {color: COR.cinza},
     hovertemplate: "%{customdata}: %{y}<extra></extra>", customdata: DIAS, cliponaxis: false,
     text: porDia.map((v) => v || ""), textposition: "outside", textfont: {size: 10}},
    {type: "bar", orientation: "h", y: H.map((_, i) => i), x: porHora, xaxis: "x2", yaxis: "y",
     marker: {color: COR.cinza}, hovertemplate: "%{customdata}h: %{x}<extra></extra>", customdata: H,
     cliponaxis: false, text: porHora.map((v) => v || ""), textposition: "outside", textfont: {size: 10}},
  ];
  const lay = {
    height: 640, margin: {l: 46, r: 70, t: 10, b: 30}, font: fonte,
    paper_bgcolor: COR.fundo, plot_bgcolor: COR.fundo, showlegend: false, bargap: 0.25,
    xaxis: {domain: [0, 0.8], tickvals: DIAS.map((_, j) => j), ticktext: DIAS, side: "bottom",
            showgrid: false, zeroline: false, fixedrange: true, range: [-0.5, DIAS.length - 0.5]},
    yaxis: {domain: [0, 0.84], tickvals: H.map((_, i) => i), ticktext: H.map((h) => h + "h"),
            autorange: "reversed", showgrid: false, zeroline: false, fixedrange: true},
    yaxis2: {domain: [0.87, 1], showticklabels: false, showgrid: false, zeroline: false, fixedrange: true},
    xaxis2: {domain: [0.82, 0.97], showticklabels: false, showgrid: false, zeroline: false, fixedrange: true},
    shapes: formas, annotations: notas,
  };
  $(".t1").innerHTML = `Quando há aula? <small>${alunos ? "soma dos matriculados nas turmas com aula em cada hora" :
    "nº de disciplinas com aula em cada hora"} · barras cinza: total por dia e por hora</small>`;
  desenhaResumo(E, pares);
  desenhaDetalhe(cel, val, unidade);
  return Plotly.react(fig, traces, lay, cfg);
}

// ---------- resumo do filtro ----------
function desenhaResumo(E, pares) {
  const c = curso();
  const alunosTot = (lista) => lista.reduce((s, a) => s + a.v, 0);
  if (!c) {
    const turmas = new Set(E.map((a) => a.s + a.t)).size;
    $(".resumo").innerHTML = `<b>Visão geral</b>: ${new Set(E.map((a) => a.s)).size} disciplinas, ` +
      `${turmas} turmas e ${E.length} encontros semanais em 2026/2. Escolha um curso para filtrar por semestre e tipo.`;
    $(".faltam").innerHTML = "";
    return;
  }
  const ok = (d) => (st.tipo === "todas" || (st.tipo === "ob" ? d.tipo === "ob" : d.tipo !== "ob"))
    && (st.nivel === "todos" || d.nivel === Number(st.nivel));
  const ds = Object.entries(c.discs).filter(([s, d]) => ok(d));
  const sem = ds.filter(([s, d]) => !d.turmas.length);
  const varias = ds.filter(([s, d]) => d.turmas.length > 1).length;
  const nivel = st.nivel === "todos" ? "todos os semestres" : `${st.nivel}º semestre`;
  const tipo = {ob: "obrigatórias", el: "optativas", todas: "disciplinas"}[st.tipo];
  let txt = `<b>${c.nome}</b> · ${nivel} · ${ds.length} ${tipo} na grade, ` +
    `<b>${ds.length - sem.length}</b> com turma em 2026/2`;
  if (varias) txt += ` (${varias} com mais de uma turma para o curso: aparecem em todos os horários delas, mas o aluno cursa uma só)`;
  txt += ".";
  if (st.nivel !== "todos" && st.tipo !== "el") {
    if (pares.length) {
      txt += ` <span class="alerta">! Choque inevitável (em qualquer combinação de turmas): ` +
        pares.map(([a, b]) => `${a} × ${b}`).join(", ") + ".</span>";
    } else {
      txt += st.refazer ? ` Refazendo ${st.refazer}: dá para encaixar com alguma combinação de turmas.`
        : " Nenhum choque inevitável entre as obrigatórias do semestre.";
    }
  }
  $(".resumo").innerHTML = txt;
  $(".faltam").innerHTML = sem.length
    ? `<details><summary>${sem.length} sem turma em 2026/2</summary>` +
      sem.map(([s, d]) => `${s} · ${esc(d.nome)} (${d.nivel}º, ${ROT_TIPO[d.tipo]})`).join("<br>") + "</details>"
    : "";
}

// ---------- detalhe sob demanda: clique numa célula ----------
function desenhaDetalhe(cel, val, unidade) {
  const box = $(".detalhe");
  if (!st.cel) {
    box.innerHTML = `<p class="muda">Clique numa célula para ver as turmas daquele horário: disciplina, ` +
      `horário, docente, sala e matriculados.</p>`;
    return;
  }
  const [i, j] = st.cel, x = cel[i][j], c = curso();
  if (!x.aulas.length) { box.innerHTML = `<h5>${DIAS[j]} ${H[i]}h</h5><p class="muda">Sem aula neste filtro.</p>`; return; }
  const itens = [...x.aulas].sort((a, b) => a.s.localeCompare(b.s) || a.t.localeCompare(b.t)).map((a) => {
    const d = c ? c.discs[a.s] : null;
    const extra = d ? ` · ${d.nivel}º sem. · ${ROT_TIPO[d.tipo]}` : "";
    const alunos = c ? `${a.mc} alunos do curso (${a.mt} na turma)` : `${a.mt} matriculados`;
    return `<li>${a.rf ? '<span class="rf">↺ refazendo</span> ' : ""}<b>${a.s}</b> · ${esc(nomeDe(a.s))}${extra}<br>` +
      `<span class="muda">turma ${a.t} · ${a.h}${a.p ? " · " + esc(a.p) : ""}${a.sala ? " · " + esc(a.sala) : ""} · ${alunos}</span></li>`;
  });
  box.innerHTML = `<h5>${DIAS[j]} ${H[i]}h · ${val(x)} ${unidade}</h5><ul>${itens.join("")}</ul>`;
}

function tudo() { montaControles(); return desenha(); }

tudo().then(() => {
  fig.on("plotly_click", (ev) => {
    const p = ev.points.find((q) => q.data.type === "heatmap");
    if (!p) return;
    const cel = [p.y, p.x];
    st.cel = st.cel && st.cel[0] === cel[0] && st.cel[1] === cel[1] ? null : cel;
    desenha();
  });
});

})();
</script>
