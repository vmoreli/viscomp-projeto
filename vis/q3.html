des de Extensão para Engenharia III", "tipo": "livre", "ideal": 7, "lib": 1, "lib_ob": 1, "sit": "livre", "turma": true, "alts": 0, "dir": [], "seq": [], "fora": []}, {"s": "1800127", "nome": "Atividades de Extensão para Engenharia IV", "tipo": "livre", "ideal": 7, "lib": 1, "lib_ob": 1, "sit": "livre", "turma": true, "alts": 0, "dir": [], "seq": [], "fora": []}, {"s": "1800043", "nome": "O Engenheiro Como Agente Ético", "tipo": "livre", "ideal": 8, "lib": 2, "lib_ob": null, "sit": "optativa", "turma": true, "alts": 1, "dir": [["1800040", "requisito fraco"]], "seq": [["1800040", "A Ética e a Responsabilidade Social em Engenharia", "op", 1]], "fora": []}, {"s": "7600074", "nome": "Informação Quântica", "tipo": "livre", "ideal": 8, "lib": 7, "lib_ob": null, "sit": "optativa", "turma": true, "alts": 1, "dir": [["SEL0460", "requisito"]], "seq": [["SMA0353", "Cálculo I", "ob", 1], ["SEL0637", "Circuitos Elétricos Lineares em Corrente Contínua", "ob", 2], ["SMA0304", "Álgebra Linear", "ob", 2], ["SEL0602", "Circuitos Elétricos", "ob", 3], ["SMA0355", "Cálculo III", "ob", 3], ["SME0602", "Cálculo Numérico", "ob", 3], ["SEL0604", "Sinais e Sistemas", "ob", 4], ["SEL0607", "Fundamentos de Semicondutores", "ob", 4], ["SEL0608", "Eletromagnetismo", "ob", 4], ["SMA0356", "Cálculo IV", "ob", 4], ["SEL0612", "Ondas Eletromagnéticas", "ob", 5], ["SEL0460", "Fundamentos de Mecânica Quântica para Engenharia 1", "op", 6]], "fora": []}, {"s": "1800322", "nome": "Extensão Universitária e Impacto Social na Engenharia", "tipo": "livre", "ideal": 9, "lib": 1, "lib_ob": 1, "sit": "livre", "turma": true, "alts": 0, "dir": [], "seq": [], "fora": []}, {"s": "1800130", "nome": "Engenharia em Ação: Extensão Acadêmica", "tipo": "livre", "ideal": 10, "lib": 1, "lib_ob": 1, "sit": "livre", "turma": false, "alts": 0, "dir": [], "seq": [], "fora": []}]}}};
const root = document.getElementById("q3_debe8102");

const COR = {tinta: "#0b0b0b", tinta2: "#52514e", muda: "#898781", grade: "#e1e0d9",
             azul: "#2a78d6", laranja: "#c2570c", fundo: "#fcfcfb"};
const st = {curso: D.ordem[0], n: 3, turma: false, aba: "sim", busca: "", sel: null};
const $ = (s) => root.querySelector(s);
const fig = $(".fig"), selCurso = $(".curso"), slider = $(".sem"), busca = $(".busca");
const cfg = {displayModeBar: false, responsive: true};
const fonte = {family: "Inter, Arial, sans-serif", size: 12, color: COR.tinta2};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const sem = (n) => `${n}º`;
const simples = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const curso = () => D.cursos[st.curso];
const universo = () => curso().opts.filter((o) => !st.turma || o.turma);
const liberada = (o) => o.lib !== null && o.lib <= st.n;

// ---------- controles (consultas dinâmicas) ----------
D.ordem.forEach((k) => selCurso.add(new Option(D.cursos[k].nome, k)));
selCurso.addEventListener("change", () => {
  st.curso = selCurso.value;
  st.n = Math.min(st.n, curso().ultimo);
  st.sel = null;
  tudo();
});
slider.addEventListener("input", () => { st.n = Number(slider.value); tudo(); });
$(".turma").addEventListener("change", (e) => { st.turma = e.target.checked; st.sel = null; tudo(); });
busca.addEventListener("input", () => { st.busca = busca.value; desenhaLista(); });
root.querySelectorAll(".abas button").forEach((b) => b.addEventListener("click", () => {
  st.aba = b.dataset.v;
  desenhaLista();
}));

// ---------- visão 1: curva acumulada ----------
function curvas() {
  const ult = curso().ultimo, xs = Array.from({length: ult}, (_, i) => i + 1), u = universo();
  return {xs, u,
    ob: xs.map((t) => u.filter((o) => o.lib_ob !== null && o.lib_ob <= t).length),
    tudo: xs.map((t) => u.filter((o) => o.lib !== null && o.lib <= t).length)};
}
function desenhaCurva() {
  const {xs, u, ob, tudo: td} = curvas();
  const total = u.length, ult = xs.length;
  const dica = xs.map((t, i) => `<b>${sem(t)} semestre</b><br>${td[i]} de ${total} optativas podem ser cursadas` +
    `<br>${ob[i]} só com obrigatórias<br>${td[i] - (i ? td[i - 1] : 0)} liberadas neste semestre<br><i>clique para ir a este semestre</i>`);
  const tracos = [
    {x: xs, y: td, customdata: dica, type: "scatter", mode: "lines+markers", line: {shape: "hv", color: COR.laranja, width: 2, dash: "dot"},
     marker: {size: 8, color: COR.laranja, line: {color: COR.fundo, width: 2}}, hovertemplate: "%{customdata}<extra></extra>"},
    {x: xs, y: ob, customdata: dica, type: "scatter", mode: "lines+markers", line: {shape: "hv", color: COR.azul, width: 2.5},
     marker: {size: 8, color: COR.azul, line: {color: COR.fundo, width: 2}}, hovertemplate: "%{customdata}<extra></extra>"},
    {x: [st.n], y: [td[st.n - 1]], type: "scatter", mode: "markers+text", hoverinfo: "skip", cliponaxis: false,
     marker: {size: 13, color: COR.fundo, line: {color: COR.tinta, width: 2.5}},
     text: [`<b>${td[st.n - 1]}</b>`], textposition: st.n >= ult - 1 ? "bottom center" : "top left", textfont: {size: 13, color: COR.tinta}}];
  const o = st.sel && curso().opts.find((x) => x.s === st.sel);
  if (o && o.lib !== null && o.lib <= ult) {
    tracos.push({x: [o.lib], y: [td[o.lib - 1]], type: "scatter", mode: "markers", hoverinfo: "skip", cliponaxis: false,
      marker: {size: 12, symbol: "diamond", color: COR.tinta, line: {color: COR.fundo, width: 2}}});
  }
  const lay = {
    height: 400, margin: {l: 50, r: 22, t: 16, b: 48}, font: fonte, showlegend: false,
    paper_bgcolor: COR.fundo, plot_bgcolor: COR.fundo, hovermode: "closest",
    xaxis: {title: {text: "semestre em que o aluno está"}, tickvals: xs, ticktext: xs.map(sem), range: [0.6, ult + 0.4],
            showgrid: false, zeroline: false, fixedrange: true},
    yaxis: {title: {text: "optativas que pode cursar"}, range: [0, Math.max(total, 1) * 1.08], gridcolor: COR.grade, zeroline: false, fixedrange: true},
    shapes: [
      {type: "line", xref: "paper", x0: 0, x1: 1, y0: total, y1: total, line: {color: COR.muda, width: 1, dash: "dash"}},
      {type: "line", x0: st.n, x1: st.n, yref: "paper", y0: 0, y1: 1, line: {color: COR.tinta, width: 1}}],
    annotations: [{xref: "paper", x: 1, xanchor: "right", y: total, yanchor: "bottom", showarrow: false,
                   text: `total de optativas: ${total}`, font: {size: 11, color: COR.tinta2}}]};
  return Plotly.react(fig, tracos, lay, cfg);
}

// ---------- resumo ----------
function desenhaResumo() {
  const {u, tudo: td} = curvas(), total = u.length, v = td[st.n - 1];
  const faltam = u.filter((o) => o.sit === "optativa").length;
  const fora = u.filter((o) => o.sit === "fora").length;
  $(".resumo").innerHTML = `<b>${esc(curso().nome)}, ${sem(st.n)} semestre:</b> ` +
    (total ? `você já pode cursar <b>${v} de ${total}</b> optativas (${Math.round(100 * v / total)}%)` : "nenhuma optativa neste filtro") +
    (st.turma ? " com turma em 2026/2" : "") +
    "." + (faltam ? ` ${faltam} ${faltam === 1 ? "exige" : "exigem"} outra optativa antes.` : "") +
    (fora ? ` ${fora} ${fora === 1 ? "depende" : "dependem"} de disciplina fora da grade.` : "");
  $(".rot-sem").textContent = `${sem(st.n)} semestre`;
}

// ---------- visão 2: lista de optativas ----------
function linha(o) {
  const nova = o.lib === st.n && st.n > 1;
  const quando = liberada(o) ? "" : (o.lib === null ? "sem caminho na grade" : `a partir do ${sem(o.lib)}`);
  return `<li><button class="op${o.s === st.sel ? " marcada" : ""}" data-s="${o.s}" aria-pressed="${o.s === st.sel}">
    <span><b>${o.s}</b> ${esc(o.nome)}${nova ? ' <span class="tag">nova</span>' : ""}</span>
    <small>${o.tipo}${o.turma ? " · turma em 2026/2" : ""}${quando ? " · " + quando : ""}</small></button></li>`;
}
function desenhaLista() {
  const t = simples(st.busca.trim());
  const combina = (o) => !t || simples(o.s + " " + o.nome).includes(t);
  const u = universo();
  const sim = u.filter(liberada), nao = u.filter((o) => !liberada(o));
  root.querySelectorAll(".abas button").forEach((b) => {
    b.classList.toggle("on", st.aba === b.dataset.v);
    b.textContent = b.dataset.v === "sim" ? `Já posso cursar (${sim.length})` : `Ainda não (${nao.length})`;
  });
  // A busca procura nas duas abas: o aluno quer achar a optativa, liberada ou não.
  const ordena = (a, b) => (liberada(b) - liberada(a)) || (b.lib === st.n) - (a.lib === st.n) ||
    (liberada(a) ? 0 : (a.lib ?? 99) - (b.lib ?? 99)) || a.s.localeCompare(b.s);
  const lista = (t ? u : st.aba === "sim" ? sim : nao).filter(combina).sort(ordena);
  $(".abas").classList.toggle("buscando", !!t);
  $(".lista").innerHTML = lista.length ? lista.map(linha).join("") : '<li class="muda">Nenhuma optativa encontrada.</li>';
}

// ---------- visão 3: sequência mínima ----------
function desenhaDetalhe() {
  const el = $(".detalhe"), o = st.sel && curso().opts.find((x) => x.s === st.sel);
  if (!o) {
    el.innerHTML = '<p class="muda">Clique em uma optativa da lista para ver o que é preciso cursar antes dela.</p>';
    return;
  }
  const direto = Object.fromEntries(o.dir);
  let corpo;
  if (o.sit === "livre") {
    corpo = "<p>Sem requisito neste curso: pode ser cursada desde o 1º semestre.</p>";
  } else if (o.sit === "fora") {
    corpo = `<p>Todas as alternativas de requisito incluem disciplina fora da grade deste curso:</p><ul class="fora">` +
      o.fora.map(([s, n]) => `<li><b>${s}</b> ${esc(n)}</li>`).join("") + "</ul>";
  } else {
    corpo = `<p>Pode ser cursada a partir do <b>${sem(o.lib)} semestre</b>, depois de <b>${o.seq.length}</b> disciplina(s):</p>` +
      `<table><thead><tr><th>Semestre</th><th>Disciplina</th><th>Vínculo</th></tr></thead><tbody>` +
      o.seq.map(([s, n, t, q]) => `<tr><td>${q ? sem(q) : "–"}</td><td><b>${s}</b> ${esc(n)}` +
        (direto[s] ? ` <span class="tag">${direto[s]} direto</span>` : "") + `</td><td>${t === "ob" ? "obrigatória" : "optativa"}</td></tr>`).join("") +
      "</tbody></table>" +
      (o.alts > 1 ? `<p class="muda">Há ${o.alts} alternativas de requisito; esta é a que libera mais cedo.</p>` : "");
  }
  el.innerHTML = `<h4>${o.s} · ${esc(o.nome)}</h4><p class="muda">Optativa ${o.tipo} · semestre ideal na grade: ${sem(o.ideal)}` +
    `${o.turma ? " · com turma em 2026/2" : " · sem turma em 2026/2"}</p>` + corpo;
}

function tudo() {
  selCurso.value = st.curso;
  slider.max = curso().ultimo;
  slider.value = st.n;
  desenhaResumo();
  desenhaLista();
  desenhaDetalhe();
  return desenhaCurva();
}

// ---------- ligação entre as visões ----------
$(".lista").addEventListener("click", (e) => {
  const b = e.target.closest("button.op");
  if (!b) return;
  st.sel = st.sel === b.dataset.s ? null : b.dataset.s;
  desenhaLista();
  desenhaDetalhe();
  desenhaCurva();
});
tudo().then(() => {
  fig.on("plotly_click", (ev) => {
    const p = ev.points.find((x) => x.curveNumber < 2);
    if (p) { st.n = p.x; tudo(); }
  });
});

})();
</script>
